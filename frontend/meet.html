<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>见面 · 余响 Encore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* 见面页专属样式（复用 V0.5 设计令牌，不新增 CSS 文件） */
  .meet-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .meet-card{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:340px}
  .meet-card .badge{margin-bottom:4px}
  .meet-num{display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:1;margin:14px 0 6px;font-family:var(--serif);font-weight:700}
  .meet-num .num{font-size:var(--fs-display);font-style:italic;
    background:var(--grad-gold-neon);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent}
  .meet-num .unit{font-family:var(--cn-serif);font-size:clamp(20px,2.6vw,30px);font-weight:700;color:var(--gold);font-style:normal}
  .meet-num.expired .num{background:none;-webkit-background-clip:border-box;background-clip:border-box;
    -webkit-text-fill-color:var(--ink-mute);color:var(--ink-mute)}
  .meet-sub{font-size:var(--fs-md);color:var(--ink-soft);margin-bottom:4px}
  .meet-date{font-family:var(--mono);font-size:var(--fs-sm);color:var(--ink-mute);letter-spacing:.3px}
  .meet-name{font-family:var(--cn-serif);font-size:var(--fs-lg);color:var(--ink);font-weight:600;margin-top:6px}
  .meet-card-foot{margin-top:auto;padding-top:24px;width:100%;display:flex;justify-content:center}
  .meet-empty{width:100%;padding:36px 24px}
  @media(max-width:960px){
    .meet-grid{grid-template-columns:1fr;max-width:480px;margin:0 auto}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><img src="assets/icons/app-icon-v2-dust-light.jpg" class="logo-icon light-only" alt="余响"><img src="assets/icons/app-icon-v2-dust.jpg" class="logo-icon dark-only" alt="余响">余响 <span class="logo-en">Encore</span></a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="map.html">场馆地图</a></li>
      <li><a href="tours.html">巡演档案</a></li>
      <li><a href="gallery.html">收藏展览</a></li>
      <li><a href="identity.html">粉丝身份</a></li>
      <li><a href="member.html">会员</a></li>
      <li><a href="meet.html" class="active">见面</a></li>
      <li><a href="expense.html">账单</a></li>
    </ul>
    <button class="nav-toggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"><span class="icon-moon">🌙</span><span class="icon-sun">☀</span></button>
      <button class="member-btn" onclick="location.href='member.html'">开通会员</button>
    </div>
  </div>
</header>

<div class="wrap">

  <section id="meet" class="meet-section">
    <div class="sec-head reveal">
      <div>
        <div class="tag">06 / Meet Countdown</div>
        <h2>见面倒计时 <em>Encore Meet</em></h2>
        <p>记录每一次相见，期待下一次重逢。灯光暗下，乐声响起，那是属于你的时刻。</p>
      </div>
    </div>

    <div class="meet-grid reveal" id="meetSection">
      <!-- 卡片 1：距上次见面 -->
      <div class="card card-pad-lg meet-card" id="lastBox"></div>
      <!-- 卡片 2：距下次见面 -->
      <div class="card card-pad-lg meet-card" id="nextBox"></div>
    </div>
  </section>

</div>

<footer>
  <div>余响 Encore · 演唱会足迹追踪 <span class="ver">v0.7.0</span></div>
  <div class="footer-copy">© 2026 余响 Encore All rights reserved</div>
</footer>

<div class="toast" id="toast"><span class="ico"></span><span id="toastText"></span></div>

<!-- 设置/修改见面 Modal -->
<div class="modal-backdrop" id="meetModal">
  <div class="modal">
    <button class="modal-close" id="meetModalClose" aria-label="关闭">×</button>
    <div class="modal-title" id="meetModalTitle">设置上次见面</div>
    <div class="modal-subtitle" id="meetModalSub">记录已经发生的那一次相见</div>
    <div class="modal-body">
      <div class="form-group" id="meetDateGroup">
        <label class="form-label" for="meetDateInput">日期 <span class="req">*</span></label>
        <input type="date" class="input" id="meetDateInput">
        <div class="form-error">请选择一个日期</div>
        <div class="form-hint">选择见面的日期</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="meetNameInput">演唱会名称</label>
        <input type="text" class="input" id="meetNameInput" placeholder="如：周杰伦嘉年华北京站" maxlength="40">
        <div class="form-hint">可选，便于日后回忆</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="meetClearBtn">清除记录</button>
      <button class="btn btn-secondary" id="meetCancelBtn">取消</button>
      <button class="btn btn-primary" id="meetSaveBtn">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
/* ===== 见面页逻辑（内联，不修改 app.js）=====
 * 数据持久化：localStorage key = encore-meet-dates
 * 依赖 app.js：toast() / toggleTheme() / initTheme() / observeReveal() / initNavToggle()
 * 等待 DOM 就绪后初始化（app.js 已同步定义全局函数）*/
(function(){
  var STORAGE_KEY = 'encore-meet-dates';
  var state = { lastMeet: null, nextMeet: null };
  var editingTarget = 'last'; // 'last' | 'next'

  /* —— 数据读写 —— */
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if(raw && typeof raw === 'object'){
        state.lastMeet = raw.lastMeet || null;
        state.nextMeet = raw.nextMeet || null;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* —— 日期工具 —— */
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }
  // 返回 toStr - fromStr 的天数（按本地午夜计算，避免时区误差）
  function daysBetween(fromStr, toStr){
    var a = new Date(fromStr + 'T00:00:00');
    var b = new Date(toStr + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }
  function formatDateCN(s){
    if(!s) return '';
    var p = s.split('-');
    if(p.length < 3) return s;
    return +p[0] + '年' + +p[1] + '月' + +p[2] + '日';
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* —— 渲染：上次见面 —— */
  function renderLast(){
    var box = document.getElementById('lastBox');
    var m = state.lastMeet;
    if(!m || !m.date){
      box.innerHTML =
        '<div class="empty meet-empty">' +
          '<div class="empty-icon">🎟</div>' +
          '<div class="empty-title">还没有见面记录</div>' +
          '<div class="empty-text">点击下方按钮，设置你的第一次见面时刻。</div>' +
          '<div class="empty-cta"><button class="btn btn-primary" data-open="last">设置上次见面</button></div>' +
        '</div>';
      return;
    }
    var days = daysBetween(m.date, todayStr());
    if(days < 0) days = 0;
    box.innerHTML =
      '<span class="badge badge-meet">Last Meet</span>' +
      '<div class="meet-num"><span class="num">' + days + '</span><span class="unit">天</span></div>' +
      '<div class="meet-sub">距上次见面</div>' +
      '<div class="meet-date">' + formatDateCN(m.date) + '</div>' +
      (m.name ? '<div class="meet-name">' + esc(m.name) + '</div>' : '') +
      '<div class="meet-card-foot"><button class="btn btn-secondary" data-open="last">设置 / 修改</button></div>';
  }

  /* —— 渲染：下次见面 —— */
  function renderNext(){
    var box = document.getElementById('nextBox');
    var m = state.nextMeet;
    if(!m || !m.date){
      box.innerHTML =
        '<div class="empty meet-empty">' +
          '<div class="empty-icon">✨</div>' +
          '<div class="empty-title">还没有期待中的见面</div>' +
          '<div class="empty-text">点击下方按钮，添加一场即将到来的演唱会。</div>' +
          '<div class="empty-cta"><button class="btn btn-primary" data-open="next">添加下次见面</button></div>' +
        '</div>';
      return;
    }
    var days = daysBetween(todayStr(), m.date);
    var expired = days < 0;
    var html = '<span class="badge ' + (expired ? 'badge-unlit' : 'badge-tour') + '">' + (expired ? '已过期' : 'Next Meet') + '</span>';
    if(expired){
      html += '<div class="meet-num expired"><span class="num">' + Math.abs(days) + '</span><span class="unit">天前</span></div>';
      html += '<div class="meet-sub">已见面 · 这场期待已过去</div>';
    } else if(days === 0){
      html += '<div class="meet-num"><span class="num">0</span><span class="unit">天</span></div>';
      html += '<div class="meet-sub">就是今天 · 享受现场！</div>';
    } else {
      html += '<div class="meet-num"><span class="num">' + days + '</span><span class="unit">天</span></div>';
      html += '<div class="meet-sub">距下次见面</div>';
    }
    html += '<div class="meet-date">' + formatDateCN(m.date) + '</div>';
    if(m.name) html += '<div class="meet-name">' + esc(m.name) + '</div>';
    html += '<div class="meet-card-foot"><button class="btn btn-secondary" data-open="next">设置 / 修改</button></div>';
    box.innerHTML = html;
  }

  function render(){ renderLast(); renderNext(); }

  /* —— Modal —— */
  function openModal(target){
    editingTarget = target;
    var m = (target === 'last' ? state.lastMeet : state.nextMeet) || {};
    document.getElementById('meetModalTitle').textContent = target === 'last' ? '设置上次见面' : '设置下次见面';
    document.getElementById('meetModalSub').textContent = target === 'last' ? '记录已经发生的那一次相见' : '期待即将到来的重逢';
    var dateInput = document.getElementById('meetDateInput');
    var nameInput = document.getElementById('meetNameInput');
    dateInput.value = m.date || todayStr();
    nameInput.value = m.name || '';
    document.getElementById('meetDateGroup').classList.remove('has-error');
    document.getElementById('meetModal').classList.add('open');
    setTimeout(function(){ dateInput.focus(); }, 60);
  }
  function closeModal(){
    document.getElementById('meetModal').classList.remove('open');
  }
  function saveMeet(){
    var dateInput = document.getElementById('meetDateInput');
    var nameInput = document.getElementById('meetNameInput');
    var date = dateInput.value;
    var name = nameInput.value.trim();
    if(!date){
      document.getElementById('meetDateGroup').classList.add('has-error');
      dateInput.focus();
      return;
    }
    var obj = { date: date };
    if(name) obj.name = name;
    if(editingTarget === 'last') state.lastMeet = obj;
    else state.nextMeet = obj;
    save();
    closeModal();
    render();
    toast(editingTarget === 'last' ? '已保存上次见面记录' : '已保存下次见面记录');
  }
  function clearMeet(){
    if(editingTarget === 'last') state.lastMeet = null;
    else state.nextMeet = null;
    save();
    closeModal();
    render();
    toast(editingTarget === 'last' ? '已清除上次见面记录' : '已清除下次见面记录');
  }

  /* —— 初始化 —— */
  function initMeet(){
    load();
    render();
    // 事件委托：打开 modal（覆盖空态 CTA 与"设置/修改"按钮）
    document.getElementById('meetSection').addEventListener('click', function(e){
      var btn = e.target.closest('[data-open]');
      if(btn) openModal(btn.getAttribute('data-open'));
    });
    document.getElementById('meetSaveBtn').addEventListener('click', saveMeet);
    document.getElementById('meetCancelBtn').addEventListener('click', closeModal);
    document.getElementById('meetClearBtn').addEventListener('click', clearMeet);
    document.getElementById('meetModalClose').addEventListener('click', closeModal);
    // 点击遮罩关闭
    document.getElementById('meetModal').addEventListener('click', function(e){
      if(e.target === this) closeModal();
    });
    // Esc 关闭
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeModal();
    });
    // 回车保存（焦点在输入框时）
    document.getElementById('meetNameInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') saveMeet();
    });
  }

  // 等待 DOM 就绪；app.js 已同步定义 toast / toggleTheme 等全局函数
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initMeet);
  } else {
    initMeet();
  }
})();
</script>
</body>
</html>
